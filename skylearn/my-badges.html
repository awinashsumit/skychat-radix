  behind() are copied verbatim from recognition.html rather than reinvented:
  the first version of this screen made up its own badge ladder and its own
  points formula, so the two halves of one system disagreed.
  See LEARNER-IA.md.
-->

<style>
  .hello { font-size: var(--fs-7); line-height: var(--lh-7); font-weight: var(--weight-bold); color: var(--fg-high); }
  .hello-s { margin-top: var(--space-3); font-size: var(--fs-4); line-height: 1.5; color: var(--fg-low); max-width: 64ch; }
  .hello-s b { font-weight: var(--weight-semibold); color: var(--fg-high); }

  .rtabs { display: flex; gap: var(--space-1); border-bottom: var(--stroke-thin) solid var(--border-subtle);
    margin: var(--space-6) 0 var(--space-5); }
  .rtab { height: 42px; padding: 0 var(--space-4); border: 0; background: transparent; cursor: pointer;
    font-family: var(--font-base); font-size: var(--fs-3); color: var(--fg-low); border-bottom: 2px solid transparent; }
  .rtab:hover { color: var(--fg-high); }
  .rtab.is-on { color: var(--fg-high); font-weight: var(--weight-semibold); border-bottom-color: var(--accent-9); }

  .sec-h { display: flex; align-items: baseline; gap: var(--space-4); margin: var(--space-6) 0 var(--space-3); }
  .sec-h h2 { flex: 1; min-width: 0; font-size: var(--fs-4); line-height: var(--lh-4);
    font-weight: var(--weight-semibold); color: var(--fg-high); }
  .sec-h span { font-size: var(--fs-2); color: var(--fg-low); }
  .sec-w { font-size: var(--fs-2); color: var(--fg-low); margin-bottom: var(--space-4); max-width: 70ch; line-height: 1.6; }

  /* The three achievement badges, exactly the three Recognition defines. */
  .ach { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: var(--space-4); }
  .ac { padding: var(--space-5); border-radius: var(--radius-4); background: var(--color-panel-solid);
    box-shadow: inset 0 0 0 1px var(--border-subtle); }
  .ac.is-got { background: var(--accent-2); box-shadow: inset 0 0 0 1px var(--accent-6); }
  .ac-m { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; background: var(--gray-3); color: var(--fg-subtle); margin-bottom: var(--space-3); }
  .ac.is-got .ac-m { background: var(--accent-9); color: var(--accent-contrast); }
  .ac-n { font-size: var(--fs-3); font-weight: var(--weight-semibold); color: var(--fg-high); }
  .ac.is-got .ac-n { color: var(--accent-11); }
  .ac-w { margin-top: var(--space-2); font-size: var(--fs-2); color: var(--fg-low); line-height: 1.55; }
  .ac-s { margin-top: var(--space-3); font-size: var(--fs-1); color: var(--fg-subtle); }

  /* Course badges: the same PNG Recognition uses, on the same faint card. */
  .cb-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); gap: var(--space-4); }
  .cb { display: flex; flex-direction: column; align-items: center; gap: var(--space-3);
    padding: var(--space-4); border-radius: 12px; background: rgba(0,0,0,.05); }
  :root[data-theme="dark"] .cb { background: rgba(255,255,255,.06); }
  .cb.is-locked { opacity: .45; }
  .cb-art { width: 100%; max-width: 132px; height: auto; display: block; }
  .cb-plate { width: 100%; padding: var(--space-3) var(--space-2); border-radius: 8px; background: #fff;
    text-align: center; font-size: var(--fs-2); font-weight: var(--weight-semibold); color: #1b1b1b; }
  .cb-w { font-size: var(--fs-1); color: var(--fg-low); }

  /* Leaderboard, the same board the administrator sees. */
  .lb { display: flex; flex-direction: column; }
  .lb-r { display: grid; grid-template-columns: 46px 1fr auto auto; gap: var(--space-4); align-items: center;
    padding: var(--space-4) var(--space-5); border-bottom: var(--stroke-thin) solid var(--border-subtle); }
  .lb-r:last-child { border-bottom: 0; }
  .lb-r.is-me { background: var(--accent-2); }
  .lb-m { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: var(--fs-2); font-weight: var(--weight-bold); }
  .lb-m.g { background: #FFAA04; color: #4a2c00; }
  .lb-m.s { background: #C9CDD2; color: #33383d; }
  .lb-m.b { background: #E08A46; color: #4a2400; }
  .lb-m.n { background: transparent; color: var(--fg-subtle); font-weight: var(--weight-medium); }
  .lb-n { min-width: 0; font-size: var(--fs-3); color: var(--fg-high);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lb-n span { display: block; font-size: var(--fs-1); color: var(--fg-low); }
  .lb-v { font-size: var(--fs-3); font-weight: var(--weight-semibold); color: var(--fg-high);
    font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
  .lb-s { font-size: var(--fs-2); white-space: nowrap; }
  .lb-s.ok  { color: var(--success-text); }
  .lb-s.bad { color: var(--warning-text); }
  @media (max-width: 720px) { .lb-r { grid-template-columns: 40px 1fr auto; } .lb-s { display: none; } }

  .note { padding: var(--space-4) var(--space-5); border-radius: var(--radius-3);

  .toast { min-width: 280px; max-width: 460px; padding: var(--space-4) var(--space-5);

<script>
/* ==============================================================
   The learner half of Recognition.

   Everything below the line is copied from recognition.html rather
   than written again: the point rules, how a period score is worked
   out, the three badges, the two course badges and the medal rule.
   The first version of this screen invented its own nine-badge
   ladder and its own points formula, so the two halves of one
   system disagreed about what a badge was and what a point was
   worth. One system, seen from two sides.
   ============================================================== */
const IRREGULAR = { person:'people' };
const plural = (n, w) => n + ' ' + (n === 1 ? w : (IRREGULAR[w] || w + 's'));
const PASS = 75;

const RECRAW = `Dana Whitfield|CNA|Lakeside Manor|12|9|2|1|72/68/61

Kwame Boateng|CNA|Lakeside Manor|12|5|0|0|68/64/57
Elena Petrova|CNA|Cedar Ridge|12|12|0|0|92/88/81
Noor Haddad|Caregiver|Cedar Ridge|10|10|0|0|87/83/76
Bram de Vries|Med Tech|Harborview|14|14|0|0|89/85/78

Grace Mbeki|Housekeeping|Cedar Ridge|4|4|0|0|-
Viktor Novikov|Housekeeping|Northgate|4|3|0|0|-
Tara Sullivan|Administrator|Cedar Ridge|6|6|0|0|88/84/77
Owen Fitzgerald|Administrator|Harborview|6|5|0|0|86/82/75`;

const CFG = {
  on: true,
  rules: [
    { k:'ontime', n:'Finished a required course before it was due', p:10, on:true,
      w:'The behaviour the whole product exists to produce.' },
    { k:'late',   n:'Finished a required course after it was due',  p:2,  on:true,
      w:'Still worth credit. Worth less than on time, or on time means nothing.' },
    { k:'comp',   n:'Passed a competency check at ' + PASS + ' or above', p:15, on:true,
      w:'Competency, not completion, is what this product sells.' },
    { k:'ilt',    n:'Attended an instructor-led session', p:15, on:true,
      w:'The hardest thing to get people to do, and the only proof for hands-on skills.' },
    { k:'renew',  n:'Renewed a certification before it lapsed', p:20, on:true,
      w:'A lapsed certificate stops somebody working unsupervised.' }
  ],
  /* Three badges, three different questions. The set before this had six,
     and Sumit spotted the problem in it by eye:

       "On time, every time" and "First year done" awarded to the same 16
       people and always would. `overdue` counts what is currently late, so
       anybody who finished their set has zero by definition. Two rules
       that can never disagree are one badge written twice.

       "Steady" was (nothing overdue) AND (nothing lapsed), and the second
       half is exactly the "Current" badge. A compound of two others.

       "Nearly there" went to 33 people, 17 of whom had not finished. It
       was a badge for almost doing the thing.

     What is left asks: did you finish what you must, are your credentials
     in date, and can you actually do the job. Nothing here is another way
     of counting courses, because the required set resets every year: a
     ladder needs a number that keeps climbing, and this one does not. */
  badges: [
    { k:'complete',  n:'Set complete', w:'Finished every required course for the year.',
      holds: p => p.done >= p.req },
    { k:'current',   n:'All current', w:'No lapsed certification.',
      holds: p => p.expired === 0 },
    { k:'competent', n:'Competent', w:'All three competency domains at ' + PASS + ' or above.',
      holds: p => !!p.comp && p.comp.every(v => v >= PASS) }
  ],
  /* One badge per course, given automatically to everyone who completes
     it. Not configured here: it is not a rule anyone tunes, it is a
     record of a fact. The two below use the same completion rosters as
     the Learners and Assign screens (`ALREADY`, by roster index), so a
     count here matches the count there rather than inventing a second
     answer to "who finished this course". A real build reads this off
     enrollment records; there are only two courses with that record in
     this prototype, so there are only two course badges. */
  courseBadges: [
    { course:'Preventing Falls in Senior Living', cat:'Safety and health', tone:'blue',
      ic:'shield', holders:[1,4,6,11,13,14,17,22,34,36] },
    { course:'HIPAA Privacy and Security', cat:'Compliance', tone:'purple',
      ic:'lock', holders:[0,2,3,5,7,12,15,20] }
  ]
};

function periodPts(p) {
  const courses = Math.round(p.done / 4);
  const late = Math.min(p.overdue, courses);
  return (courses - late) * val('ontime') + late * val('late') +
         (p.comp && p.comp.every(v => v >= PASS) ? val('comp') : 0) +
         (p.expired === 0 ? val('renew') : 0);
}
const upToDate = p => p.done >= p.req && p.overdue === 0 && p.expired === 0;
function behind(p) {
  return [p.done < p.req ? plural(p.req - p.done, 'course') + ' outstanding' : '',
          p.overdue ? plural(p.overdue, 'course') + ' overdue' : '',
          p.expired ? plural(p.expired, 'certificate') + ' lapsed' : ''].filter(Boolean).join(', ');
}
function withTier(rows) {
  let tier = 0, prev = null;
  return rows.map(r => { if (r.pts !== prev) { tier++; prev = r.pts; } return Object.assign({ tier:tier }, r); });
}


/* The roster recognition.html uses, in its own eight-field shape.
   name|role|community|required|done|overdue|expired|competency
   Asserted equal to learners.html on every shared field, all 44 rows. */
const PEOPLE = RECRAW.split('\n').map(function (l, i) {
  const f = l.split('|');
  return { i:i, n:f[0], role:f[1], comm:f[2], req:+f[3], done:+f[4],
           overdue:+f[5], expired:+f[6],
           comp: f[7] === '-' ? null : f[7].split('/').map(Number) };
});

/* Which of the five states each demo learner is in, so the View as menu
   keeps working. Derived from the same fields recognition.html uses. */
const STATES = [
  { k:'lapsed', l:'Certificate lapsed', f: p => p.expired > 0 },
  { k:'late',   l:'Something late',     f: p => !p.expired && p.overdue > 0 },
  { k:'todo',   l:'Courses to do',      f: p => !p.expired && !p.overdue && p.done < p.req },
  { k:'top',    l:'Holds a medal',      f: p => false },
  { k:'clear',  l:'Nothing outstanding',f: p => p.done >= p.req && !p.overdue && !p.expired }
];
const WHO = {};
STATES.forEach(s => { WHO[s.k] = PEOPLE.filter(s.f)[0]; });
/* The medal holder is whoever actually tops the board, not a guess. */
WHO.top = null;

const $   = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC = {
  award:'<path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/>',
  lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>'
};
const ic = (n, s) => '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" ' +
  'stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>';
function toast(a, b) {
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = '<div><div class="toast-title">'+esc(a)+'</div>' +
    (b ? '<div class="toast-body">'+esc(b)+'</div>' : '')+'</div>';
  $('toasts').appendChild(el); setTimeout(() => el.remove(), 4600);
}
const val = k => (CFG.rules.filter(r => r.k === k)[0] || { p:0 }).p;

function ranked() {
  return withTier(PEOPLE.map(p => ({ p:p, pts:periodPts(p) })).sort((a, b) => b.pts - a.pts));
}
const S = { who:'lapsed', tab:'badges' };
</script>

<script>
function render() {
  const rows = ranked();
  WHO.top = rows[0].p;
  const me = WHO[S.who] || rows[0].p;
  const mine = rows.filter(r => r.p.i === me.i)[0];

  const got = CFG.badges.filter(b => b.holds(me));
  const myCourse = CFG.courseBadges.filter(b => b.holders.indexOf(me.i) >= 0);

  const tabs = '<div class="rtabs" role="tablist">' +
    [['badges','Badges'], ['board','Leaderboard']].map(x =>
      '<button class="rtab' + (S.tab === x[0] ? ' is-on' : '') + '" role="tab" ' +
      'aria-selected="' + (S.tab === x[0]) + '" data-t="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>';

  let body;
  if (S.tab === 'badges') {
    body =
      '<div class="sec-h"><h2>Course badges</h2><span>' + myCourse.length + ' of ' +
        CFG.courseBadges.length + '</span></div>' +
      '<p class="sec-w">The same badge for every course, given automatically when you finish it. ' +
        'Nothing to aim for and nothing to tune &mdash; it is a record that you did it.</p>' +
      '<div class="cb-grid">' + CFG.courseBadges.map(function (b) {
        const has = b.holders.indexOf(me.i) >= 0;
        return '<div class="cb' + (has ? '' : ' is-locked') + '">' +
          '<img class="cb-art" src="assets/course-badge.png" alt="" />' +
          '<span class="cb-plate">' + esc(b.course) + '</span>' +
          '<span class="cb-w">' + (has ? 'You hold this' : 'Finish the course to earn it') +
            ' &middot; ' + b.holders.length + ' of ' + PEOPLE.length + ' hold it</span>' +
        '</div>';
      }).join('') + '</div>' +

      '<div class="sec-h"><h2>Achievements</h2><span>' + got.length + ' of ' + CFG.badges.length + '</span></div>' +
      '<p class="sec-w">Three badges, three different questions: did you finish what you must, ' +
        'are your credentials in date, and can you do the job.</p>' +
      '<div class="ach">' + CFG.badges.map(function (b) {
        const has = b.holds(me);
        const n = PEOPLE.filter(b.holds).length;
        return '<div class="ac' + (has ? ' is-got' : '') + '">' +
          '<span class="ac-m">' + ic(has ? 'award' : 'lock', 20) + '</span>' +
          '<div class="ac-n">' + esc(b.n) + '</div>' +
          '<div class="ac-w">' + esc(b.w) + '</div>' +
          '<div class="ac-s">' + (has ? 'You hold this. ' : '') + n + ' of ' + PEOPLE.length + ' hold it</div>' +
        '</div>';
      }).join('') + '</div>' +

      '<div class="note">These are the badges your administrator sees on the Recognition screen. ' +
        'Same three achievements, same course badge, same holders &mdash; one system, two sides of it.</div>';
  } else {
    const top = rows.slice(0, 10);
    const inTop = top.filter(r => r.p.i === me.i).length > 0;
    body =
      '<p class="sec-w">A rolling 90 days, so somebody who joined in March can still win it. ' +
        'Gold goes to everybody on the top score, silver to everybody on the next, bronze to the one after that.</p>' +
      '<div class="card" style="padding:0;overflow:hidden;"><div class="lb">' +
        top.concat(inTop ? [] : [mine]).map(function (r) {
          const p = r.p, ok = upToDate(p), why = behind(p);
          return '<div class="lb-r' + (p.i === me.i ? ' is-me' : '') + '">' +
            '<span class="lb-m ' + (r.tier <= 3 ? ['g','s','b'][r.tier - 1] : 'n') + '">' +
              (r.tier <= 3 ? '' : r.tier) + '</span>' +
            '<span class="lb-n">' + esc(p.n) + '<span>' + esc(p.role) + ', ' + esc(p.comm) + '</span></span>' +
            '<span class="lb-v">' + r.pts + '</span>' +
            '<span class="lb-s ' + (ok ? 'ok' : 'bad') + '">' + (ok ? 'Up to date' : esc(why)) + '</span>' +
          '</div>';
        }).join('') + '</div></div>' +
      '<div class="note">Points come from ' + CFG.rules.filter(r => r.on).length + ' rules: ' +
        CFG.rules.filter(r => r.on).map(r => esc(r.n.toLowerCase()) + ' (' + r.p + ')').join(', ') + '. ' +
        'Your administrator sets them; this is what they produced.</div>';
  }

  $('view').innerHTML =
    '<div class="hello">Badges</div>' +
    '<div class="hello-s">You hold <b>' + (got.length + myCourse.length) + '</b> badge' +
      (got.length + myCourse.length === 1 ? '' : 's') + ' and you are <b>' +
      (mine.tier <= 3 ? ['first','second','third'][mine.tier - 1] : mine.tier + 'th') +
      '</b> on the board with <b>' + mine.pts + '</b> points over 90 days.</div>' +
    tabs + body;

  wire();
}

function wire() {
  $('view').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { S.tab = b.dataset.t; render(); });
}

function renderWho() {
  const list = $('whoList');
  if (!list) return;
  list.innerHTML = STATES.filter(s => WHO[s.k]).map(function (s) {
    const p = WHO[s.k];
    return '<a href="#" role="menuitem" data-who="' + s.k + '" aria-current="' + (s.k === S.who) + '">' +
      '<span class="vr"></span><span class="vw">' + esc(p.n) + '<span>' + esc(s.l.toLowerCase()) + '</span></span></a>';
  }).join('');
  list.querySelectorAll('[data-who]').forEach(a => a.onclick = e => {
    e.preventDefault(); e.stopPropagation();
    S.who = a.dataset.who;
    $('viewAs').hidden = true;
    $('viewAsBtn').setAttribute('aria-expanded', 'false');
    renderMe(); renderWho(); render();
  });
}
function renderMe() {
  const p = WHO[S.who] || PEOPLE[0];
  $('meAv').textContent   = p.n.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
  $('meName').textContent = p.n;
  $('meRole').textContent = p.role + ', ' + p.comm;
}

const viewAsBtn = document.getElementById('viewAsBtn');
if (viewAsBtn) {
  const menu = document.getElementById('viewAs');
  viewAsBtn.addEventListener('click', e => {
    e.stopPropagation();
    const open = !menu.hidden;
    menu.hidden = open;
    viewAsBtn.setAttribute('aria-expanded', String(!open));
  });
  document.addEventListener('click', () => {
    if (!menu.hidden) { menu.hidden = true; viewAsBtn.setAttribute('aria-expanded', 'false'); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !menu.hidden) { menu.hidden = true; viewAsBtn.setAttribute('aria-expanded', 'false'); }
  });
}
const railBtn = document.getElementById('railBtn');
if (railBtn) {
  railBtn.addEventListener('click', () => {
    const shell = document.querySelector('.app-shell');
    const side  = document.querySelector('.app-sidebar');
    const on = shell.style.gridTemplateColumns === '0px 1fr';
    shell.style.gridTemplateColumns = on ? '256px 1fr' : '0px 1fr';
    if (side) side.style.visibility = on ? 'visible' : 'hidden';
    railBtn.setAttribute('aria-label', on ? 'Collapse navigation' : 'Expand navigation');
  });
}
$('themeBtn').addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
});

renderMe(); renderWho(); render();
</script>
</body>
</html>
